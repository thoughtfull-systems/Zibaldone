[workspace]
members = ["core", "linux"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false
rust-version = "1.89"
version = "0.1.0"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight the project's style or add noise without catching bugs.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[workspace.lints.rust]
unsafe_code = "forbid"

# Tests and development builds compile often, so they trade debug information for speed.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1

# Installs rebuild often, so release builds skip link-time optimization, which re-optimizes every
# dependency on each build.
[profile.release]
lto = false
