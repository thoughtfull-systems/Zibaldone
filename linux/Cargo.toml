[package]
description = "Zibaldone on Linux: the instance and the zib command"
edition.workspace = true
name = "zib-linux"
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
# Without this feature, the binaries run as the development channel, so a build from the source
# tree never touches the production data.
production = []

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_6"] }
async-channel = "2.5.0"
base64 = "0.22.1"
gdk-pixbuf = "0.22.0"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_16"] }
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
ksni = "0.3.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
zib-core = { path = "../core", features = ["print"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
