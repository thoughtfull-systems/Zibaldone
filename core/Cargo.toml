[package]
description = "The core of Zibaldone: spaces, notes, files, search, and sync"
edition.workspace = true
name = "zib-core"
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
# SQLite built from source, for platforms without a system SQLite that has FTS5, such as Android.
bundled-sqlite = ["rusqlite/bundled"]
default = ["net", "render"]
# Connections between machines over iroh, which most tests of the core don't need.
net = ["dep:futures-util", "dep:iroh", "dep:iroh-mdns-address-lookup"]
# Printing notes to PDF with Typst, which only the Linux app turns on, as ZIB0010 describes.
print = ["dep:typst", "dep:typst-kit", "dep:typst-layout", "dep:typst-pdf", "render"]
# Math and diagrams drawn as images, which most tests of the core don't need.
render = [
  "dep:merman",
  "dep:ratex-layout",
  "dep:ratex-parser",
  "dep:ratex-svg",
  "dep:ratex-types",
  "dep:resvg",
]

[dependencies]
blake3 = "1.8.7"
ciborium = "0.2.2"
futures-util = { version = "0.3.31", default-features = false, optional = true }
getrandom = "0.3.4"
iroh = { version = "1.4.1", optional = true }
iroh-mdns-address-lookup = { version = "0.6.1", optional = true }
loro = "1.17.1"
merman = { version = "0.9.3", default-features = false, features = [
  "all-diagrams",
  "layout-cytoscape",
  "svg",
], optional = true }
pulldown-cmark = { version = "0.13.6", default-features = false }
qrcode = { version = "0.14.1", default-features = false }
ratex-layout = { version = "0.1.15", optional = true }
ratex-parser = { version = "0.1.15", optional = true }
ratex-svg = { version = "0.1.15", features = ["embed-fonts"], optional = true }
ratex-types = { version = "0.1.15", optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
resvg = { version = "0.47.0", optional = true }
rusqlite = "0.41.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.54.1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
] }
typst = { version = "0.15.1", optional = true }
typst-kit = { version = "0.15.1", default-features = false, features = [
  "embedded-fonts",
  "scan-fonts",
], optional = true }
typst-layout = { version = "0.15.1", optional = true }
typst-pdf = { version = "0.15.1", optional = true }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
uuid = { version = "1.29.0", features = ["v7"] }

[dev-dependencies]
tempfile = "3.23.0"

[lints]
workspace = true
