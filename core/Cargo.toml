[package]
description = "The core of Zibaldone: spaces, notes, files, search, and sync"
edition.workspace = true
name = "zib-core"
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
# SQLite built from source, for platforms without a system SQLite that has FTS5, such as Android.
bundled-sqlite = ["rusqlite/bundled"]
default = ["net"]
# Connections between machines over iroh, which most tests of the core don't need.
net = ["dep:iroh", "dep:iroh-mdns-address-lookup"]

[dependencies]
blake3 = "1.8.7"
ciborium = "0.2.2"
getrandom = "0.3.4"
iroh = { version = "1.4.1", optional = true }
iroh-mdns-address-lookup = { version = "0.6.1", optional = true }
loro = "1.17.1"
pulldown-cmark = { version = "0.13.6", default-features = false }
rusqlite = "0.41.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.54.1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
] }
uuid = { version = "1.29.0", features = ["v7"] }

[dev-dependencies]
tempfile = "3.23.0"

[lints]
workspace = true
