<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Zib Web Clipper settings</title>
    <script src="options.js" defer></script>
  </head>
  <body>
    <h1>Zib Web Clipper settings</h1>
    <p>
      <label for="space">Destination space</label>
      <select id="space" disabled></select>
      <button id="reload" type="button">Refresh spaces</button>
    </p>
    <p id="status" role="status"></p>
    <p>Allow the clipper to download web PDFs and images hosted on other sites.</p>
    <button id="download-access" type="button">Allow web downloads</button>
    <p id="download-status" role="status"></p>
  </body>
</html>
